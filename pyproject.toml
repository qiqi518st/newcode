[project]
name = "mewcode"
version = "0.4.5"
requires-python = ">=3.10"
dependencies = [
  "prompt_toolkit>=3.0",
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
]

[project.scripts]
mewcode = "mewcode.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]